name: ci
on:
  pull_request:
  push:
    branches: [main, 'codex/**', 'claude/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-and-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:cycles
      - run: npm test
      - run: npm run demo
      - run: npm run check

  integration-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: ci-admin-password-only-for-ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Throwaway credentials of an ephemeral CI database; not secrets of any environment.
      ULYSSE_DB_HOST: 127.0.0.1
      ULYSSE_DB_PORT: '55432'
      ULYSSE_DB_ADMIN_USER: postgres
      ULYSSE_DB_ADMIN_PASSWORD: ci-admin-password-only-for-ci
      ULYSSE_DB_MIGRATOR_PASSWORD: ci-migrator-password-only
      ULYSSE_DB_APP_PASSWORD: ci-app-password-only-ci
      ULYSSE_DB_WORKER_PASSWORD: ci-worker-password-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:bootstrap
      - run: npm run db:migrate
      - run: npm run test:integration
